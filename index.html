<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Racing Game Pro</title>

<style>
body { margin:0; overflow:hidden; font-family:Arial; background:black; }

/* MENU */
#menu {
  position:absolute;
  width:100%;
  height:100vh;
  background:black;
  color:white;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

/* GAME */
#gameArea {
  display:none;
  width:360px;
  height:100vh;
  margin:auto;
  position:relative;
  overflow:hidden;
  background:#111;
}

/* ROAD */
.line {
  width:10px; height:100px;
  background:white;
  position:absolute;
  left:175px;
}

/* PLAYER */
.car {
  width:70px;
  position:absolute;
  bottom:20px;
  left:145px;
}

/* ENEMY */
.enemy {
  width:70px;
  position:absolute;
  top:-120px;
}

/* UI */
#score { position:absolute; top:10px; left:10px; color:white; }
#high { position:absolute; top:30px; left:10px; color:white; }

#nitro {
  position:fixed;
  bottom:20px;
  right:20px;
  padding:15px;
  border:none;
  border-radius:50%;
  background:red;
  color:white;
  font-size:18px;
}

.car, .enemy {
  object-fit: contain;
}
</style>
</head>

<body>

<div id="menu">
  <h1>🏎️ Racing Game</h1>
  <button onclick="start()">Start Game</button>
</div>

<div id="gameArea">
  <div id="score">Score:0</div>
  <div id="high">High:0</div>

  <!-- FIXED PLAYER IMAGE -->
  <img id="player" class="car"
  src="https://cdn.pixabay.com/photo/2012/05/29/00/43/car-49278_1280.png">
</div>

<button id="nitro" onclick="nitro()">🔥</button>

<!-- SOUND -->
<audio id="engine" src="https://www.soundjay.com/transportation/car-engine-1.mp3" loop></audio>
<audio id="crash" src="https://www.soundjay.com/mechanical/crash.mp3"></audio>

<script>
let gameArea=document.getElementById("gameArea");
let player=document.getElementById("player");

let score=0;
let speed=5;
let running=false;
let pos=145;

let high=localStorage.getItem("high")||0;
document.getElementById("high").innerText="High:"+high;

// START (sound fix for mobile)
function start(){
  document.getElementById("menu").style.display="none";
  gameArea.style.display="block";

  let engine=document.getElementById("engine");
  engine.play().catch(()=>{}); // mobile autoplay fix

  running=true;
}

// TOUCH CONTROL (smooth)
gameArea.addEventListener("touchmove",e=>{
  let rect = gameArea.getBoundingClientRect();
  pos = e.touches[0].clientX - rect.left - 35;

  if(pos<0) pos=0;
  if(pos>300) pos=300;

  player.style.left=pos+"px";
});

// ROAD
for(let i=0;i<6;i++){
  let l=document.createElement("div");
  l.classList.add("line");
  l.style.top=(i*120)+"px";
  gameArea.appendChild(l);
}

function moveRoad(){
  document.querySelectorAll(".line").forEach(l=>{
    let t=parseInt(l.style.top);
    t+=speed;
    if(t>window.innerHeight) t=-100;
    l.style.top=t+"px";
  });
}

// ENEMY SPAWN (FIXED IMAGE)
function spawn(){
  if(!running) return;

  let e=document.createElement("img");
  e.src="https://cdn.pixabay.com/photo/2013/07/12/18/20/car-153127_1280.png";
  e.classList.add("enemy");
  e.style.left=Math.random()*300+"px";
  gameArea.appendChild(e);

  let top=-120;

  function move(){
    if(!running) return;

    top+=speed;
    e.style.top=top+"px";

    let p=player.getBoundingClientRect();
    let er=e.getBoundingClientRect();

    if(p.left<er.right && p.right>er.left &&
       p.top<er.bottom && p.bottom>er.top){
        gameOver();
    }

    if(top<window.innerHeight){
      requestAnimationFrame(move);
    } else {
      e.remove();
      score++;
      document.getElementById("score").innerText="Score:"+score;
    }
  }
  move();
}

setInterval(spawn,900);

// NITRO
function nitro(){
  speed+=6;
  setTimeout(()=>speed-=6,2000);
}

// GAME LOOP
function loop(){
  if(running) moveRoad();
  requestAnimationFrame(loop);
}
loop();

// GAME OVER
function gameOver(){
  running=false;

  document.getElementById("engine").pause();
  document.getElementById("crash").play();

  if(score>high){
    localStorage.setItem("high",score);
  }

  alert("Game Over Score:"+score);
  location.reload();
}
</script>

</body>
</html>
